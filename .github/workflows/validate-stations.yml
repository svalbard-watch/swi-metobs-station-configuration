name: Validate stations

# swi-metobs-caching runs `git pull origin main` on this repository before every cron
# run and reads the station files. Its loader only logs problems: a malformed file
# silently drops its stations, and an unknown `datasource` silently falls back to a Frost
# source. This check makes those mistakes fail before they are merged.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test the validator
        run: python3 -m unittest discover -s tests -v

      - name: Check the structure of the station files
        run: python3 scripts/validate_stations.py stations

      # Each `datasource` must be one the caching code knows, otherwise it falls back to
      # FrostSource without an error. A new source therefore has to be released in
      # swi-metobs-caching before a station can use it. The check always runs against the
      # newest published image: `--pull always` makes docker ask the registry for the
      # current `latest` instead of reusing a copy that is already on the runner.
      - name: Check the datasource names against the latest swi-metobs-caching image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/swi-metobs-caching:latest
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'Checking against {{index .RepoDigests 0}}'
          docker run --rm --pull always -e PYTHONPATH=/swi -w /swi -v "$PWD:/repo:ro" \
            --entrypoint python3 "$IMAGE" \
            /repo/scripts/validate_stations.py /repo/stations --check-datasources
